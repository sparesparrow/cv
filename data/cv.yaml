      cs: "Verifikace typu hardware-in-the-loop pro bezpečnostně certifikovanou dvoustupňovou řídicí jednotku zapalování plynového kotle (UL/CSA, ANSI Z21.20, NFPA 54) jako jediný vlastník verifikační testovací sady i automatizovaného standu, který ji řídí. Odpovědnost za celou dodávku: trasovatelnost požadavků, evidence chyb, práce s větvemi a pull requesty, balíčkování v Conanu, integrace do CI a měsíční reporting pro klienta."
    highlights:
      - en: "Designed an Arrange/Act/Assert validation pipeline in Python with eight independent gates covering preconditions, stimulus timing, state sequence, alarms, signal history, cross-layer consistency, timer accuracy and requirement traceability."
        cs: "Navrhl validační pipeline typu Arrange/Act/Assert v Pythonu s osmi nezávislými branami pokrývajícími předpoklady, časování stimulů, posloupnost stavů, alarmy, historii signálů, konzistenci napříč vrstvami, přesnost časovačů a trasovatelnost požadavků."
        tags: [hil, verification]
