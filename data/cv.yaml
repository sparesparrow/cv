summary:
  en:
    - "Senior C++ engineer working on safety-critical and real-time systems: aircraft onboard diagnostics at Honeywell, electron-microscopy detector software at Thermo Fisher Scientific, and a Linux inspection proxy and firewall at Trusted Network Solutions."
    - "Most recently sole owner of the hardware-in-the-loop verification suite and automated bench for a safety-certified two-stage gas furnace ignition controller (UL/CSA, ANSI Z21.20, NFPA 54), raising measured conformance to 259 of 271 tracked state transitions (95.6%)."
    - "Linux, networking and security specialist — Netlink, nftables, TLS inspection, Kerberos/LDAP/OCSP — with C++20 daemons shipped as Debian packages and a Rust reimplementation published on crates.io."
    - "Builds agentic-AI tooling on the Model Context Protocol: an agent harness adopted into a daily client delivery workflow, and MCP-Prompts, published to npm, Docker Hub and the MCP directories (Glama, MCP Market, PulseMCP) with 97 stars and 21 forks."
  cs:
    - "Senior C++ inženýr se zaměřením na bezpečnostně kritické systémy reálného času: palubní diagnostika letadel v Honeywellu, software pro detektory elektronových mikroskopů ve Thermo Fisher Scientific a inspekční proxy a firewall na Linuxu v Trusted Network Solutions."
    - "Naposledy jediný vlastník verifikační sady typu hardware-in-the-loop a automatizovaného testovacího standu pro bezpečnostně certifikovanou dvoustupňovou řídicí jednotku zapalování plynového kotle (UL/CSA, ANSI Z21.20, NFPA 54); naměřenou shodu zvýšil na 259 z 271 sledovaných přechodů (95,6 %)."
    - "Specialista na Linux, sítě a bezpečnost — Netlink, nftables, inspekce TLS, Kerberos/LDAP/OCSP — s démony v C++20 dodávanými jako balíčky pro Debian a s reimplementací v Rustu publikovanou na crates.io."
    - "Staví agentní AI nástroje nad Model Context Protocolem: agentní harness přijatý do každodenního dodávkového procesu u klienta a projekt MCP-Prompts publikovaný na npm, Docker Hub a v adresářích MCP serverů (Glama, MCP Market, PulseMCP) s 97 hvězdami a 21 forky."

