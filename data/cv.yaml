      - en: "Built a data-driven generator expanding a YAML catalogue of 270+ state transitions, 38 states and 33 events into roughly 290 executable tests, removing hand-written duplication."
        cs: "Vytvořil datově řízený generátor, který z YAML katalogu 270+ stavových přechodů, 38 stavů a 33 událostí rozvine zhruba 290 spustitelných testů a odstraní ručně psanou duplicitu."
        tags: [hil, verification]
        metric: true
