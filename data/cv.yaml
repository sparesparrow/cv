open_source:
  - id: mcp-prompts
    name: "MCP-Prompts"
    featured: true
    url: "https://github.com/sparesparrow/mcp-prompts"
    stars: 97
    forks: 21
    tech: ["TypeScript", "Node.js", "PostgreSQL + pgvector", "Docker", "REST + SSE", "AWS"]
    summary:
      en: "Model Context Protocol server for managing prompt templates and LLM interactions, with four core MCP implementations (filesystem operations, memory management, AWS integration and generic MCP configurations). Implemented a hexagonal architecture and integration tests; ships Docker images across multiple server types, AWS deployment examples (S3, Lambda, DynamoDB, CloudWatch, IAM, ECR), vector-based semantic search with pgvector and real-time collaboration over Server-Sent Events. Published to npm and Docker Hub and listed across the MCP server directories."
      cs: "Server Model Context Protocolu pro správu promptových šablon a interakcí s LLM se čtyřmi základními MCP implementacemi (operace se souborovým systémem, správa paměti, integrace s AWS a obecné MCP konfigurace). Postaven na hexagonální architektuře s integračními testy; dodává Docker image pro několik typů serverů, příklady nasazení na AWS (S3, Lambda, DynamoDB, CloudWatch, IAM, ECR), sémantické vyhledávání nad vektory v pgvector a spolupráci v reálném čase přes Server-Sent Events. Publikováno na npm a Docker Hub a zařazeno do adresářů MCP serverů."
    links:
      - {label: "GitHub", url: "https://github.com/sparesparrow/mcp-prompts"}
      - {label: "npm", url: "https://www.npmjs.com/package/@sparesparrow/mcp-prompts"}
