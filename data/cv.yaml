        summary:
          en: "Rust reimplementation optimized for memory efficiency and high concurrency while maintaining full MCP protocol compatibility."
          cs: "Reimplementace v Rustu optimalizovaná na paměťovou efektivitu a vysokou souběžnost při zachování plné kompatibility s protokolem MCP."

  - id: rust-network-mgr
    name: "rust-network-mgr"
    featured: true
    url: "https://github.com/sparesparrow/rust-network-mgr"
    tech: ["Rust", "Netlink", "nftables", "epoll", "Lock-free data structures"]
    summary:
      en: "Redesign and reimplementation of ipmon as a Rust daemon orchestrating dynamic firewall rules via Netlink with a minimal memory footprint. Event-driven architecture for real-time network state changes, with atomic firewall updates that prevent race conditions and inconsistent rulesets during topology changes, lock-free data structures and epoll-based multiplexing for high-throughput event processing."
      cs: "Přepracování a reimplementace ipmonu jako démona v Rustu, který přes Netlink řídí dynamická pravidla firewallu s minimální paměťovou stopou. Událostmi řízená architektura pro změny stavu sítě v reálném čase s atomickými aktualizacemi firewallu, které při změnách topologie brání souběhům a nekonzistentním sadám pravidel, s bezzámkovými datovými strukturami a multiplexováním přes epoll pro vysokou propustnost událostí."
    links:
      - {label: "GitHub", url: "https://github.com/sparesparrow/rust-network-mgr"}
      - {label: "crates.io", url: "https://crates.io/crates/rust-network-mgr"}

  - id: rtp-midi
    name: "rtp-midi"
    featured: true
    url: "https://github.com/sparesparrow/rtp-midi"
    stars: 2
    tech: ["Rust (66.5%)", "RTP-MIDI", "OSC", "Android NDK (Kotlin)", "ESP32 / FreeRTOS", "Docker"]
    summary:
      en: "Modular Rust architecture for real-time MIDI, audio and LED control. Low-latency MIDI routing connects music production hardware to DAWs and addressable LED systems over network protocols. Includes an Android hub (Kotlin + Rust NDK) with a foreground service, AMidi NDK and mDNS discovery, plus an ESP32 visualizer using FastLED and dual-core FreeRTOS, in a dual-protocol design: RTP-MIDI for DAWs, OSC for LED devices."
      cs: "Modulární architektura v Rustu pro MIDI, zvuk a řízení LED v reálném čase. Směrování MIDI s nízkou latencí propojuje hudební hardware s DAW i adresovatelnými LED systémy přes síťové protokoly. Součástí je android hub (Kotlin + Rust NDK) s popředí běžící službou, AMidi NDK a objevováním přes mDNS a vizualizér na ESP32 s FastLED a dvoujádrovým FreeRTOS; dvouprotokolový návrh: RTP-MIDI pro DAW, OSC pro LED zařízení."
    links:
      - {label: "GitHub", url: "https://github.com/sparesparrow/rtp-midi"}

  - id: ipmon
    name: "ipmon"
    featured: false
    url: "https://github.com/sparesparrow/ipmon"
    tech: ["C++20", "Linux kernel / NETLINK", "nftables", "Multi-threading", "systemd", "Debian packaging"]
    summary:
      en: "Netlink socket monitoring daemon that detects real-time IPv4/IPv6 address changes and updates nftables firewall rules accordingly. Built with modern C++20 using RAII, move semantics, thread-safe and atomic operations, an event-driven architecture, Unix domain sockets for IPC and JSON configuration management. Packaged for Debian-based systems with complete systemd hardening profiles for production deployment."
      cs: "Démon monitorující Netlink sockety, který detekuje změny adres IPv4/IPv6 v reálném čase a podle nich aktualizuje pravidla firewallu nftables. Postaven v moderním C++20 s RAII, přesouvací sémantikou, vláknově bezpečnými a atomickými operacemi, událostmi řízenou architekturou, unixovými sockety pro IPC a konfigurací v JSON. Balíčkováno pro systémy založené na Debianu s kompletními zpevňujícími profily systemd pro produkční nasazení."
    links:
      - {label: "GitHub", url: "https://github.com/sparesparrow/ipmon"}

