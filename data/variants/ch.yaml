# Swiss (CH) application dossier.
#
# Renders through templates/swiss.html.j2 -- the only variant with its own
# template, because Swiss CV conventions are structurally different from the
# generic A4 layout: photo, personal-details block (nationality / work permit /
# date of birth), CEFR language levels, and a references-on-request closing.
# build.py picks that template up by variant name (see PRINT_TEMPLATES there).
#
# Conventions applied here, in the data rather than in the template:
#   * page_budget [2, 2] -- a Swiss dossier CV is two A4 pages, not one and not
#     three.  build.py asserts it, so this file is tuned until it fits.
#   * English, not Czech: the addressable Swiss market for this profile is the
#     English-speaking engineering employers.  German is A1 (see data/cv.yaml)
#     and a German-language CV would misrepresent that.
#   * No salary expectations -- there is no field for them and none is wanted.
#   * Nothing is invented: date of birth is conventional in Switzerland but is
#     absent from data/cv.yaml, so it simply does not render.  Add
#     `meta.date_of_birth` to the data if you want that row.
extends: ../cv.yaml

name: ch
description: Swiss two-page application dossier — photo, personal details, CEFR languages, references on request.

locale: en

# Availability is deliberately absent: the Czech IČO contracting line does not
# speak to a Swiss employer, and work authorization is hoisted into the
# personal-details block by the template instead of being its own section.
# Preferred roles and interests are dropped too -- a Swiss CV stays factual and
# the two-page budget pays for experience instead.
sections: [summary, experience, skills, open_source, education, languages]

emphasize_tags: [cpp, embedded, safety-critical, verification, linux]

# Three highlights per role: enough to carry the evidence, few enough for two
# pages.  Full chronology is kept -- Swiss screeners read the whole career.
experience_detail: compact

page_budget: [2, 2]

# `include` is a single id set spanning experience and open source, so every
# role that should survive is listed alongside the three featured projects.
include:
  - resideo
  - thermofisher
  - honeywell
  - tns
  - selfemployed
  - ibm
  - mcp-prompts
  - rust-network-mgr
  - rtp-midi
